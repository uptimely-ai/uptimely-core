default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Engine/example runs regenerate these artifacts without trailing newlines.
        exclude: '(^examples/pump_analytics/data/pump_telemetry_calculated\.json$|/_generated/)'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: poetry run pytest
        args: [-n, "4"]
        language: system
        stages: [pre-commit]
        types: [python]
        pass_filenames: false
