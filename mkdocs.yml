site_name: Uptimely Core
site_description: Declarative analytics for industrial use cases
site_url: https://uptimely-ai.github.io/uptimely-core/
repo_url: https://github.com/uptimely-ai/uptimely-core
edit_uri: edit/main/docs/
strict: true
watch: [src/uptimely]

theme:
  name: mkdocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature_annotations: true
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.mjs

exclude_docs: |
  /vendor/
  /_site/
  /.bundle/
  /.jekyll-cache/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Overview:
      - Introduction: overview/index.md
      - The problem: overview/problem.md
      - Architecture: overview/architecture.md
  - Specification:
      - Introduction: specification/index.md
      - Format reference: specification/specification.md
  - Components:
      - Introduction: components/index.md
      - Compiler: components/compiler/index.md
      - Engine: components/engine/index.md
      - AI agents: components/ai/index.md
  - Artifacts:
      - Introduction: artifacts/index.md
      - Automatic documentation: artifacts/automatic-documentation.md
      - Feature dependency graph: artifacts/feature-graph.md
  - Development:
      - Introduction: development/index.md
      - Project structure: development/project-structure.md
      - Organizing analytics: development/organize.md
      - Analytical functions: development/analytical-functions.md
      - Roadmap: development/roadmap.md
  - Python API: reference/api.md
