site_name: Uptimely Core
site_description: Declarative analytics for industrial use cases
site_url: https://uptimely-ai.github.io/uptimely-core/
repo_url: https://github.com/uptimely-ai/uptimely-core
edit_uri: edit/main/docs/
watch: [src/uptimely]

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_init: false
            show_signature_annotations: true
            show_root_heading: true
            show_root_toc_entry: false
            show_source: false
            separate_signature: true
            show_symbol_type_heading: true
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!^__all__$"
            members_order: source

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      toc_depth: 3
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.mjs

extra_css:
  - assets/stylesheets/style.css
  - assets/stylesheets/infographic.css

exclude_docs: |
  /vendor/
  /_site/
  /.bundle/
  /.jekyll-cache/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Getting started:
      - Quick start: index.md
      - Tutorial: getting-started/tutorial.md
      - Explorer demo: getting-started/explorer-demo.md
      - Background: background.md
  - Architecture:
      - Overview: architecture/index.md
      - Project: architecture/project.md
      - Spec: architecture/spec.md
      - Compiler: architecture/compiler.md
      - Engine: architecture/engine.md
      - Explorer: architecture/explorer.md
      - AI agents: architecture/ai.md
  - Data science:
      - Uptimely practices: data-science/uptimely-practices.md
      - Analytical functions: data-science/analytical-functions.md
      - Data Modeling: data-science/data-modeling.md
      - Comparison to SQL: data-science/comparison-to-sql.md
      - Platform comparison: data-science/platform-comparison.md
      - Data science work: data-science/way-of-work.md
      - Research: data-science/research.md
  - Project layout:
      - Project structure: project-layout/project-structure.md
      - Organizing analytics: project-layout/organize.md
  - Roadmap:
      - Development roadmap: roadmap/index.md
      - Backlog: roadmap/backlog.md
  - Reference:
      - CLI:
          - Overview: reference/cli/index.md
          - spec: reference/cli/spec.md
          - engine: reference/cli/engine.md
          - examples: reference/cli/examples.md
          - explorer: reference/cli/explorer.md
          - project: reference/cli/project.md
      - MCP:
          - Setup: reference/mcp/index.md
          - Tool reference: reference/mcp/tools.md
      - Python:
          - Overview: reference/python/index.md
          - Projects: reference/python/project.md
          - Spec:
              - Overview: reference/python/spec.md
              - Python authoring: reference/python/python.md
              - Operations: reference/python/spec/api.md
              - Document models: reference/python/spec/model.md
              - Serialization: reference/python/spec/serialization.md
              - Validation: reference/python/spec/validation.md
              - Feature graphs: reference/python/feature-graph.md
              - Row context: reference/python/row-context.md
              - Shared vocabulary: reference/python/spec-vocabulary.md
          - Compiler and plans: reference/python/compiler.md
          - Execution engine: reference/python/engine.md
          - Explorer: reference/python/explorer.md
          - Python entrypoints: reference/python/entrypoint.md
          - Storage: reference/python/storage.md
