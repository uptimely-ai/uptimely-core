site_name: Uptimely Core
site_description: Declarative analytics for industrial use cases
site_url: https://uptimely-ai.github.io/uptimely-core/
repo_url: https://github.com/uptimely-ai/uptimely-core
edit_uri: edit/main/docs/
watch: [src/uptimely]

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_init: false
            show_signature_annotations: true
            show_root_heading: true
            show_root_toc_entry: false
            show_source: false
            separate_signature: true
            show_symbol_type_heading: true
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!^__all__$"
            members_order: source

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      toc_depth: 3
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.mjs

extra_css:
  - assets/stylesheets/style.css
  - assets/stylesheets/infographic.css

exclude_docs: |
  /vendor/
  /_site/
  /.bundle/
  /.jekyll-cache/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - "Demo: Pump Analytics": examples/pump_analytics/index.html
      - The problem: overview/problem.md
      - Architecture: overview/architecture.md
      - Spec infographic: overview/spec.md
  - Components:
      - About: components/index.md
      - Spec: components/spec.md
      - Compiler: components/compiler.md
      - Engine: components/engine.md
  - Tools:
      - Overview: tools/index.md
      - Explorer: tools/explorer.md
      - AI agents: tools/ai.md
  - Data science:
      - Platform comparison: data-science/platform-comparison.md
      - Difference to dimensional modeling: data-science/dimensional-modeling.md
      - Data science work: data-science/way-of-work.md
      - Analytical functions: data-science/analytical-functions.md
      - Research: data-science/research.md
  - Project layout:
      - Project structure: project-layout/project-structure.md
      - Organizing analytics: project-layout/organize.md
  - Roadmap:
      - Development roadmap: roadmap/index.md
      - Backlog: roadmap/backlog.md
  - CLI:
      - Overview: cli/index.md
      - spec: cli/spec.md
      - engine: cli/engine.md
      - examples: cli/examples.md
      - explorer: cli/explorer.md
      - project: cli/project.md
  - Python API:
      - Overview: python/index.md
      - project: python/project.md
      - spec:
          - Overview: python/spec.md
          - api: python/spec/api.md
          - model: python/spec/model.md
          - json: python/spec/json.md
          - validation: python/spec/validation.md
          - python: python/python.md
          - feature_graph: python/feature-graph.md
      - compiler: python/compiler.md
      - engine: python/engine.md
      - explorer: python/explorer.md
      - row_context: python/row-context.md
      - entrypoint: python/entrypoint.md
      - storage: python/storage.md
      - spec vocabulary: python/spec-vocabulary.md
