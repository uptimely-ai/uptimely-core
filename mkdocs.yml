site_name: Uptimely Core
site_description: Declarative analytics for industrial use cases
site_url: https://uptimely-ai.github.io/uptimely-core/
repo_url: https://github.com/uptimely-ai/uptimely-core
edit_uri: edit/main/docs/
watch: [src/uptimely]

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature_annotations: true
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.mjs

extra_css:
  - assets/stylesheets/infographic.css

exclude_docs: |
  /vendor/
  /_site/
  /.bundle/
  /.jekyll-cache/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Demo:
      - Pump Analytics: examples/pump_analytics/index.html
  - Overview:
      - The problem: overview/problem.md
      - Infographic: overview/infographic.md
      - Architecture: overview/architecture.md
      - Modeling patterns: overview/patterns.md
  - Specification:
      - About Specification: specification/index.md
      - Analytics: specification/analytics.md
      - Compiler: specification/compiler.md
      - Execution engine: specification/engine.md
  - Components:
      - Overview: components/index.md
      - Analytics Explorer: components/docs.md
      - AI agents: components/ai.md
  - Development:
      - Project structure: development/project-structure.md
      - Organizing analytics: development/organize.md
      - Analytical functions: development/analytical-functions.md
  - Roadmap: roadmap.md
  - Python API: reference/api.md
