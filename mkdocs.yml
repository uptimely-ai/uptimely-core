site_name: Uptimely Core
site_description: Declarative analytics for industrial use cases
site_url: https://uptimely-ai.github.io/uptimely-core/
repo_url: https://github.com/uptimely-ai/uptimely-core
edit_uri: edit/main/docs/
watch: [src/uptimely]

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_init: false
            show_signature_annotations: true
            show_root_heading: true
            show_root_toc_entry: false
            show_source: false
            separate_signature: true
            show_symbol_type_heading: true
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!^__all__$"
            members_order: source

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      toc_depth: 3
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.mjs

extra_css:
  - assets/stylesheets/style.css
  - assets/stylesheets/infographic.css

exclude_docs: |
  /vendor/
  /_site/
  /.bundle/
  /.jekyll-cache/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Demo:
      - Intro: demo/index.md
      - Pump Analytics: examples/pump_analytics/index.html
  - Overview:
      - The problem: overview/problem.md
      - Architecture: overview/architecture.md
      - Spec: overview/spec.md
  - Comparisons:
      - Analytics platforms: comparisons/spec-platforms.md
      - Data science work: comparisons/data-science-work.md
  - Components:
      - About: components/index.md
      - Spec: components/spec.md
      - Compiler: components/compiler.md
      - Engine: components/engine.md
  - Tools:
      - Overview: tools/index.md
      - Explorer: tools/explorer.md
      - AI agents: tools/ai.md
  - Analytics development:
      - Project structure: development/project-structure.md
      - Organizing analytics: development/organize.md
      - Analytical functions: development/analytical-functions.md
  - Roadmap:
      - Development roadmap: roadmap/index.md
      - Backlog: roadmap/backlog.md
  - CLI:
      - Overview: reference/cli.md
      - spec: reference/cli/spec.md
      - engine: reference/cli/engine.md
      - examples: reference/cli/examples.md
      - explorer: reference/cli/explorer.md
      - plan: reference/cli/plan.md
      - project: reference/cli/project.md
  - Python API:
      - Overview: reference/api.md
      - spec:
          - Overview: reference/api/spec.md
          - api: reference/api/spec/api.md
          - model: reference/api/spec/model.md
          - resolved: reference/api/spec/resolved.md
          - json: reference/api/spec/json.md
          - validation: reference/api/spec/validation.md
          - python: reference/api/python.md
          - feature_graph: reference/api/feature-graph.md
      - compiler: reference/api/compiler.md
      - engine: reference/api/engine.md
      - explorer: reference/api/explorer.md
      - row_context: reference/api/row-context.md
      - entrypoint: reference/api/entrypoint.md
      - storage: reference/api/storage.md
      - contracts: reference/api/contracts.md
