site_name: Uptimely Core
site_description: Declarative analytics for industrial use cases
site_url: https://uptimely-ai.github.io/uptimely-core/
repo_url: https://github.com/uptimely-ai/uptimely-core
edit_uri: edit/main/docs/
watch: [src/uptimely]

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_init: false
            show_signature_annotations: true
            show_root_heading: true
            show_root_toc_entry: false
            show_source: false
            separate_signature: true
            show_symbol_type_heading: true
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!^__all__$"
            members_order: source

markdown_extensions:
  - admonition
  - def_list
  - md_in_html
  - toc:
      toc_depth: 3
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.mjs

extra_css:
  - assets/stylesheets/style.css
  - assets/stylesheets/infographic.css

exclude_docs: |
  /vendor/
  /_site/
  /.bundle/
  /.jekyll-cache/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Quick start: index.md
  - Introduction:
      - The problem: overview/problem.md
      - Concepts: overview/concepts.md
      - Demo explorer: examples/pump_analytics/index.html
  - Architecture:
      - Overview: architecture/index.md
      - Project: architecture/project.md
      - Spec: architecture/spec.md
      - Compiler: architecture/compiler.md
      - Engine: architecture/engine.md
      - Explorer: architecture/explorer.md
      - AI agents: architecture/ai.md
  - Data science:
      - Data Modeling: data-science/data-modeling.md
      - Comparison to SQL: data-science/comparison-to-sql.md
      - Platform comparison: data-science/platform-comparison.md
      - Data science work: data-science/way-of-work.md
      - Analytical functions: data-science/analytical-functions.md
      - Research: data-science/research.md
  - Project layout:
      - Project structure: project-layout/project-structure.md
      - Organizing analytics: project-layout/organize.md
  - Roadmap:
      - Development roadmap: roadmap/index.md
      - Backlog: roadmap/backlog.md
  - Reference:
      - CLI:
          - Overview: cli/index.md
          - spec: cli/spec.md
          - engine: cli/engine.md
          - examples: cli/examples.md
          - explorer: cli/explorer.md
          - project: cli/project.md
      - MCP:
          - Setup: mcp/index.md
          - Tool reference: mcp/tools.md
      - Python:
          - Overview: python/index.md
          - Projects: python/project.md
          - Spec:
              - Overview: python/spec.md
              - Python authoring: python/python.md
              - Operations: python/spec/api.md
              - Document models: python/spec/model.md
              - Serialization: python/spec/serialization.md
              - Validation: python/spec/validation.md
              - Feature graphs: python/feature-graph.md
              - Row context: python/row-context.md
              - Shared vocabulary: python/spec-vocabulary.md
          - Compiler and plans: python/compiler.md
          - Execution engine: python/engine.md
          - Explorer: python/explorer.md
          - Python entrypoints: python/entrypoint.md
          - Storage: python/storage.md
