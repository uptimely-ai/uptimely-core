site_name: Uptimely Core
site_description: Declarative analytics for industrial use cases
site_url: https://uptimely-ai.github.io/uptimely-core/
repo_url: https://github.com/uptimely-ai/uptimely-core
edit_uri: edit/main/docs/
watch: [src/uptimely]

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_init: false
            show_signature_annotations: true
            show_root_heading: true
            show_root_toc_entry: false
            show_source: false
            separate_signature: true
            show_symbol_type_heading: true
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!^__all__$"
            members_order: source

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      toc_depth: 3
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.mjs

extra_css:
  - assets/stylesheets/style.css
  - assets/stylesheets/infographic.css

exclude_docs: |
  /vendor/
  /_site/
  /.bundle/
  /.jekyll-cache/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Getting started:
      - Quick start: index.md
      - Tutorial: getting-started/tutorial.md
      - Explorer demo: getting-started/explorer-demo.md
  - Concepts:
      - Overview: architecture/index.md
      - Data modeling: data-science/data-modeling.md
      - Architecture:
          - Application: architecture/application.md
          - Compiler: architecture/compiler.md
          - Engine: architecture/engine.md
          - Explorer: architecture/explorer.md
  - Guides:
      - Project structure: architecture/folder-structure.md
      - Project template: getting-started/project-template.md
      - Data science practices:
          - Uptimely practices: data-science/uptimely-practices.md
          - Analytical functions: data-science/analytical-functions.md
      - AI and MCP:
          - Set up MCP: reference/mcp/index.md
          - AI agents: architecture/ai.md
  - Reference:
      - Configuration: architecture/config.md
      - Python API:
          - Overview: reference/python/index.md
          - Spec declarations: reference/python/python.md
          - Spec documents:
              - Overview: reference/python/spec.md
              - Document models: reference/python/spec/model.md
              - Loading and conversion: reference/python/spec/api.md
              - Serialization: reference/python/spec/serialization.md
              - Validation: reference/python/spec/validation.md
          - Feature graphs: reference/python/feature-graph.md
          - Row context: reference/python/row-context.md
          - Application: reference/python/application.md
          - Compiler and plans: reference/python/compiler.md
          - Execution engine: reference/python/engine.md
          - Explorer: reference/python/explorer.md
          - Python entrypoints: reference/python/entrypoint.md
          - Storage: reference/python/storage.md
          - Shared vocabulary: reference/python/spec-vocabulary.md
      - CLI:
          - Overview: reference/cli/index.md
          - uptimely example: reference/cli/examples.md
          - uptimely build: reference/cli/project.md
          - uptimely run: reference/cli/engine.md
          - uptimely explore: reference/cli/explorer.md
          - uptimely export: reference/cli/export.md
          - uptimely feature-graph: reference/cli/spec.md
      - MCP tools: reference/mcp/tools.md
      - File formats:
          - Spec JSON: architecture/spec.md
          - Execution plan JSON: architecture/execution-plan.md
  - Project:
      - Background and motivation: background.md
      - Data science work: data-science/way-of-work.md
      - Comparisons:
