name: Cooling Pump Category
description: Maximum motor-bearing temperature for each cooling-pump category.
category: Cooling System
scope: Cooling-pump categories declared in the data-center asset registry
seed: read_pump_category
grain: [machine_dimension.machine_category]
features:
  max_capacity_category:
    description: Default maximum chilled-water flow capacity for the pump category.
    type: float
    unit: m3/h
assembly:
  read_pump_category:
    function: pump_io:read_file
    args:
      source: "$paths.pump_category_source"
      rename:
        max_capacity: "$output.max_capacity_category"
      schema:
        max_capacity: float
  aggregate_bearing_temperature_by_category:
    function: pump_analytics:aggregate
    args:
      aggregations:
        "$input.bearing_temperature": max
      dimensions: [machine_category_id]
      rename:
        bearing_temperature: "$output.bearing_temperature_category_max"
    merge: default
  write_pump_category:
    function: pump_io:write_file
    args:
      features: ["$input.bearing_temperature_category_max", "$input.max_capacity_category"]
      output: "$paths.pump_category_output"
