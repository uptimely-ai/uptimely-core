title: Uptimely Core
description: Declarative analytics for industrial use cases
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
markdown: kramdown

mermaid:
  version: "9.1.6"

sass:
  # Remove these suppressions when the remote theme migrates to modern Sass.
  silence_deprecations:
    - color-functions
    - global-builtin
    - import
