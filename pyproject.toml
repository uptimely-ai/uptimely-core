[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "uptimely-core"
version = "0.0.1"
description = "Declarative numerical analytics with complex dependencies at scale"
authors = [{ name = "Mikael Ahonen", email = "mikael.ahonen@uptimely.ai" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "readme.md"
# graphable requires Python >=3.13, so 3.13 is the floor until that widens.
requires-python = ">=3.13,<4.0"
keywords = ["analytics", "declarative", "industrial", "feature-engineering", "polars"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "polars>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "graphable>=0.6.1,<0.8",
  "Jinja2>=3.1,<4.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2.0"]
# fastmcp 2.x caps mcp<2.0 with broken metadata; 4.x pairs with mcp 2.x.
mcp = ["fastmcp>=2.12,<5.0"]

[project.scripts]
uptimely = "uptimely.cli.cli:main"
uptimely-mcp = "uptimely.mcp.server:main"

[project.urls]
Homepage = "https://github.com/uptimely-ai/uptimely-core"
Repository = "https://github.com/uptimely-ai/uptimely-core"
Documentation = "https://uptimely-ai.github.io/uptimely-core"

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["pre-commit>=3.0", "ruff>=0.8"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.7,<10.0", "mkdocstrings[python]>=1.0,<2.0"]

[tool.poetry]
packages = [{ include = "uptimely", from = "src" }]

[tool.poetry.group.docs]
optional = true

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: end-to-end tests using example projects",
]

[tool.coverage.run]
source = ["src/uptimely"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_also = ["if TYPE_CHECKING:"]
