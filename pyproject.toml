[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "uptimely-core"
version = "0.0.1"
description = "Declarative numerical analytics with complex dependencies at scale"
authors = ["Mikael Ahonen <mikael.ahonen@uptimely.ai>"]
license = "MIT"
readme = "readme.md"
homepage = "https://github.com/uptimely-ai/uptimely-core"
repository = "https://github.com/uptimely-ai/uptimely-core"
documentation = "https://uptimely-ai.github.io/uptimely-core"
keywords = ["analytics", "declarative", "industrial", "feature-engineering", "polars"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
packages = [{ include = "uptimely", from = "src" }]

[tool.poetry.dependencies]
# graphable requires Python >=3.13, so 3.13 is the floor until that widens.
python = ">=3.13,<4.0"
polars = ">=1.0,<2.0"
numpy = ">=1.26,<3.0"
graphable = ">=0.6.1,<0.8"
Jinja2 = ">=3.1,<4.0"
pydantic = ">=2.10,<3.0"
boto3 = { version = ">=1.34,<2.0", optional = true }
# fastmcp 2.x caps mcp<2.0 with broken metadata; 4.x pairs with mcp 2.x.
fastmcp = { version = ">=2.12,<5.0", optional = true }

[tool.poetry.extras]
s3 = ["boto3"]
mcp = ["fastmcp"]

[tool.poetry.group.test.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.0"
ruff = ">=0.8"

[tool.poetry.scripts]
uptimely = "uptimely.cli.cli:main"
uptimely-mcp = "uptimely.mcp.server:main"

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: end-to-end tests using example projects",
]

[tool.coverage.run]
source = ["src/uptimely"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_also = ["if TYPE_CHECKING:"]
