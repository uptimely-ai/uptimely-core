name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(poetry version -s)"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match pyproject version $PKG"
            exit 1
          fi
      - name: Verify changelog contains package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(poetry version -s)"
          if [[ "$PACKAGE_VERSION" == *.dev* ]]; then
            echo "Development release; changelog entries remain under Unreleased."
            exit 0
          fi
          RELEASE_ENTRY_COUNT="$(
            awk -v version="$PACKAGE_VERSION" '
              $1 == "##" && $2 == "[" version "]" && $3 == "-" &&
              $4 ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ { count++ }
              END { print count + 0 }
            ' CHANGELOG.md
          )"
          if [ "$RELEASE_ENTRY_COUNT" -ne 1 ]; then
            echo "Expected exactly one dated CHANGELOG.md heading for $PACKAGE_VERSION; found $RELEASE_ENTRY_COUNT."
            exit 1
          fi
      - run: poetry build
      - run: pipx run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *".dev"* ]]; then
            args+=(--prerelease --generate-notes)
          else
            version="${GITHUB_REF_NAME#v}"
            awk -v version="$version" '
              $1 == "##" && $2 == "[" version "]" { in_section=1; next }
              in_section && /^## / { exit }
              in_section
            ' CHANGELOG.md > release-notes.md
            if [[ ! -s release-notes.md ]]; then
              echo "No changelog section found for $version" >&2
              exit 1
            fi
            args+=(--notes-file release-notes.md)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            "${args[@]}"
