name: Docs release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/checkout@v5
      - name: Check documentation copies match
        run: |
          diff -u readme.md docs/index.md
          diff -u example/README.md docs/getting-started/tutorial.md
      - run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: poetry.lock
      - run: poetry install --without dev,test --with docs
      - name: Build pump analytics demo site
        run: |
          poetry run uptimely build example
      - name: Run pump analytics demo
        run: |
          poetry run uptimely run example \
            --preview 10 \
            --log-level debug
      - name: Check tutorial commands
        run: |
          UPTIMELY="$(poetry env info --path)/bin/uptimely"
          cd example
          "$UPTIMELY" build
          "$UPTIMELY" run
          "$UPTIMELY" explorer export . --output "$RUNNER_TEMP/example-explorer.zip"
          test -s "$RUNNER_TEMP/example-explorer.zip"
      - name: Export static Explorer to the docs
        run: |
          poetry run uptimely explorer export \
            --project-root example \
            --output docs/example
      - run: poetry run mkdocs build --site-dir site
      - name: Upload the site for deployment
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Publish docs site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
