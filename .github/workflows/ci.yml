name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # graphable requires Python >=3.13; widen the matrix when that changes.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: poetry.lock
      - run: poetry install --with test
      - run: poetry run pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: coverage.xml

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: poetry build --format wheel
      - name: Build separate analytics package
        working-directory: tests/fixtures/installed_project
        run: poetry build --format wheel --output ../../../dist
      - name: Install release wheels in a clean environment
        run: |
          python -m venv "${{ runner.temp }}/uptimely-installed"
          "${{ runner.temp }}/uptimely-installed/bin/python" -m pip install dist/*.whl
      - name: Test installed console commands outside the checkout
        run: |
          "${{ runner.temp }}/uptimely-installed/bin/python" -I tests/packaging/check_installed.py -v
